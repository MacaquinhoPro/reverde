# Integración continua de Reverde.
#
# Cuatro trabajos, del más rápido al más lento, para que un error tonto no
# espere diez minutos antes de reportarse:
#
#   calidad   → lint, typecheck, unitarias con cobertura, build, deriva OpenAPI
#   api       → pruebas de integración contra un PostgreSQL real
#   qa        → Playwright en los tres motores de navegador
#   seguridad → auditoría de dependencias y búsqueda de secretos
#
# El despliegue de la SPA lo hace la integración de Vercel con Git, no este
# workflow (ver docs/runbooks/despliegue.md).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push nuevo cancela la corrida anterior de la misma rama: no tiene sentido
# gastar minutos en un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  calidad:
    name: Lint · typecheck · unitarias · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Prisma genera el cliente tipado; sin esto el typecheck de la API falla.
      - name: Generar el cliente de Prisma
        run: npm run prisma:generate -w @reverde/server

      - name: Lint
        run: npm run lint

      - name: Typecheck (frontend + API)
        run: npm run typecheck

      - name: Pruebas unitarias del frontend con cobertura
        run: npm run test:coverage

      - name: Pruebas unitarias de la API (sin base de datos)
        run: npm run test:api:coverage

      - name: Presupuestos de rendimiento del motor
        run: npm run test:load

      - name: Build de producción
        run: npm run build

      # La especificación solo sirve si refleja el código.
      - name: Verificar que la especificación OpenAPI no tenga deriva
        run: npm run docs:openapi:check

      - name: Guardar los reportes de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  api:
    name: Pruebas de integración de la API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reverde
          POSTGRES_PASSWORD: reverde
          POSTGRES_DB: reverde_test
        ports: ['5432:5432']
        # Sin el healthcheck las pruebas arrancan antes de que Postgres acepte
        # conexiones y fallan por una carrera, no por el código.
        options: >-
          --health-cmd "pg_isready -U reverde -d reverde_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://reverde:reverde@localhost:5432/reverde_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generar el cliente de Prisma
        run: npm run prisma:generate -w @reverde/server

      # globalSetup aplica las migraciones y siembra roles y permisos.
      - name: Pruebas de integración
        run: npm run test:api

      - name: Build de la API
        run: npm run build:api

  qa:
    name: QA end-to-end (3 motores de navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Instalar los navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      # La matriz completa: Chromium, Firefox y WebKit en escritorio + 3
      # perfiles móviles. Playwright levanta vite por su cuenta.
      - name: Playwright
        run: npm run test:qa:all

      - name: Guardar el reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Guardar las trazas de los fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7

  seguridad:
    name: Dependencias y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # El escaneo de secretos necesita el historial para comparar commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # No bloquea todavía: primero hay que ver qué reporta y decidir el umbral
      # (pendiente S8 de docs/arquitectura/seguridad.md).
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

      # Barrera simple y sin dependencias: ningún .env real debe estar
      # versionado. Es el error más fácil de cometer y el más caro.
      - name: Comprobar que no haya archivos .env versionados
        run: |
          encontrados="$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.example$' || true)"
          if [ -n "$encontrados" ]; then
            echo "✗ Hay archivos de entorno versionados:" >&2
            echo "$encontrados" >&2
            exit 1
          fi
          echo "✓ Ningún .env versionado"
